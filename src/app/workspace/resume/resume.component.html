<section class="experience-section" aria-labelledby="experience-heading">
  <div class="experience-shell">
    <div class="experience-layout">
      <header class="experience-intro">
        <p class="experience-eyebrow">
          <span class="experience-eyebrow-rule" aria-hidden="true"></span>
          Experience
        </p>
        <h2 id="experience-heading" class="experience-title">
          My Professional Journey
        </h2>
        <p class="experience-lede">{{ intro }}</p>
      </header>

      <ol class="experience-timeline">
        @for (event of events; track event.title + event.date) {
          <li class="experience-entry">
            <div class="experience-marker" aria-hidden="true">
              <span class="experience-dot"></span>
            </div>
            <div class="experience-card">
              <p class="experience-date">{{ event.date }}</p>
              <h3 class="experience-role">{{ event.title }}</h3>
              <p class="experience-company">{{ event.company }}</p>
              <p class="experience-copy">{{ event.description }}</p>
            </div>
          </li>
        }
      </ol>
    </div>
  </div>
</section>
