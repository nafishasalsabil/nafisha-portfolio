<section class="contact-section" aria-labelledby="contact-heading">
  <div class="contact-shell">
    <div class="contact-layout">
      <div class="contact-info">
        <h2 id="contact-heading" class="contact-title">
          Let's build something meaningful.
        </h2>

        <p class="contact-lede">
          Whether you have an opportunity, an interesting project, or a question,
          I'd love to hear from you.
        </p>

        <div class="contact-details">
          <a
            class="contact-detail"
            href="https://mail.google.com/mail/?view=cm&fs=1&to=nafishasalsabil98@gmail.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="pi pi-envelope" aria-hidden="true"></i>
            <span>nafishasalsabil98&#64;gmail.com</span>
          </a>
          <a class="contact-detail" href="tel:+8801738739735">
            <i class="pi pi-phone" aria-hidden="true"></i>
            <span>+8801738739735</span>
          </a>
        </div>
      </div>

      <form
        class="contact-form"
        [formGroup]="contactForm"
        (ngSubmit)="onSubmit()"
        novalidate
      >
        <a #mailtoLink class="sr-only-link" tabindex="-1" aria-hidden="true"></a>

        <div class="field-row">
          <label class="field">
            <span class="field-label">Name</span>
            <input
              type="text"
              formControlName="name"
              placeholder="Your name"
              autocomplete="name"
              [attr.aria-invalid]="isInvalid('name')"
              [attr.aria-describedby]="isInvalid('name') ? 'contact-name-error' : null"
            />
            @if (isInvalid('name')) {
              <span id="contact-name-error" class="field-error" role="alert">Name is required.</span>
            }
          </label>

          <label class="field">
            <span class="field-label">Email</span>
            <input
              type="email"
              formControlName="email"
              placeholder="Your email"
              autocomplete="email"
              [attr.aria-invalid]="isInvalid('email')"
              [attr.aria-describedby]="isInvalid('email') ? 'contact-email-error' : null"
            />
            @if (isInvalid('email')) {
              <span id="contact-email-error" class="field-error" role="alert">Enter a valid email.</span>
            }
          </label>
        </div>

        <label class="field">
          <span class="field-label">Subject</span>
          <input
            type="text"
            formControlName="subject"
            placeholder="Subject"
            [attr.aria-invalid]="isInvalid('subject')"
            [attr.aria-describedby]="isInvalid('subject') ? 'contact-subject-error' : null"
          />
          @if (isInvalid('subject')) {
            <span id="contact-subject-error" class="field-error" role="alert">Subject is required.</span>
          }
        </label>

        <label class="field">
          <span class="field-label">Message</span>
          <textarea
            formControlName="message"
            placeholder="Your message"
            rows="6"
            [attr.aria-invalid]="isInvalid('message')"
            [attr.aria-describedby]="isInvalid('message') ? 'contact-message-error' : null"
          ></textarea>
          @if (isInvalid('message')) {
            <span id="contact-message-error" class="field-error" role="alert">Message is required.</span>
          }
        </label>

        <div class="contact-form-actions">
          <button
            type="submit"
            class="contact-submit"
            [disabled]="submitting"
          >
            @if (submitting) {
              <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
              Sending…
            } @else {
              Send Message
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
